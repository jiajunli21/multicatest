spring:
  application:
    name: ifund-hq-project
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

server:
  port: ${SERVER_PORT:8080}

# ETF tab ranking config
etf-tab:
  redis:
    key: "plateStatEtf:rank:data"
  cache:
    caffeine:
      ttl-seconds: 30
      max-size: 100

logging:
  level:
    com.ifund.hq: INFO
